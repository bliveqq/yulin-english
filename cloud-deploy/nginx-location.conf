# Include inside an existing HTTPS server block. Replace the absolute path.
location /english/ {
    alias /srv/yulin/public/;
    autoindex off;
    etag on;
    add_header X-Content-Type-Options nosniff;
}
location = /english/manifest.json {
    alias /srv/yulin/public/manifest.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=300";
}
